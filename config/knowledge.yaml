# AI 的知識來源，寫越完整 AI 答得越好
FAQ:
  - 問: 營業時間？
    答: 週一至週五 10:00-19:00，週末公休。
  - 問: 可以退換貨嗎？
    答: 收到商品 7 天內可以退換貨，需保留原包裝與發票。
  - 問: 運費怎麼算？
    答: 單筆滿 1000 元免運，未滿收 80 元。

